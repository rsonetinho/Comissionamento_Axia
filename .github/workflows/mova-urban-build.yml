name: Build Mova Urban APK

on:
  push:
    branches:
      - mova-urban-android-build
    paths:
      - 'mova-urban/**'
      - '.github/workflows/mova-urban-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p mova-urban assembleDebug --stacktrace

      - name: Verify APK exists
        run: ls -lh mova-urban/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Mova Urban APK
        uses: actions/upload-artifact@v4
        with:
          name: Mova-Urban-Android-APK
          path: mova-urban/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
