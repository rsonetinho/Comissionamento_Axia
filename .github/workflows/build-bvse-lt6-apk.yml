name: Build BVSE-LT6 APK

on:
  push:
    branches:
      - bvse-lt6-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          test -f app/src/main/assets/index.html

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Align unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            BVSE_LT6_Torres_aligned_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging BVSE_LT6_Torres_aligned_unsigned.apk > build-info.txt
          sha256sum BVSE_LT6_Torres_aligned_unsigned.apk >> build-info.txt

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: bvse-lt6-apk-build
          path: |
            BVSE_LT6_Torres_aligned_unsigned.apk
            apksigner.jar
            build-info.txt
          if-no-files-found: error
          retention-days: 7
