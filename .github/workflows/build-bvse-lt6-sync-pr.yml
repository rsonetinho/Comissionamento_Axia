name: Validate BVSE-LT6 Sync APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore project and full synchronization patch
        run: |
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          cat fullpatch.part00 fullpatch.part01 fullpatch.part02 fullpatch.part03 fullpatch.part04 | base64 -d > fullpatch.tar.gz
          test "$(sha256sum fullpatch.tar.gz | cut -d' ' -f1)" = "2d6f1b91e570ae2f2a13ad7696582ca6251f31ab33b9fc73f3f9023215cb11e3"
          tar -xzf fullpatch.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path('app/build.gradle') if Path('app/build.gradle').exists() else Path('app/build.gradle.kts')
          s=b.read_text(encoding='utf-8')
          if b.suffix=='.gradle':
              s=re.sub(r'versionCode\s+\d+','versionCode 3',s,count=1)
              s=re.sub(r'versionName\s+["\'][^"\']+["\']','versionName "1.2.0"',s,count=1)
          else:
              s=re.sub(r'versionCode\s*=\s*\d+','versionCode = 3',s,count=1)
              s=re.sub(r'versionName\s*=\s*["\'][^"\']+["\']','versionName = "1.2.0"',s,count=1)
          b.write_text(s,encoding='utf-8')
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          js=html[html.index('<script>')+8:html.rindex('</script>')]
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'Pré-cadastro do colaborador' app/src/main/assets/index.html
          grep -q 'migrateLegacyRecords' app/src/main/assets/index.html
          grep -q 'syncJson' app/src/main/java/br/com/sebv/bvselt6/MainActivity.java
          node --check /tmp/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        run: gradle --no-daemon :app:assembleRelease
      - name: Inspect APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk > build-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk >> build-info.txt
          unzip -p BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk assets/index.html | grep -q 'migrateLegacyRecords'
          unzip -p BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk classes.dex | strings | grep -q 'syncJson'
          sha256sum BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk >> build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bvse-lt6-sync-v120-build
          path: |
            BVSE_LT6_Torres_Sync_v1.2.0_aligned_unsigned.apk
            apksigner.jar
            build-info.txt
          retention-days: 7
